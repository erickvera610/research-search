name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-model.txt
      - run: python train_model.py
      - run: python robustness_benchmark.py
      - run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test_demo.cjs
      - name: Run twenty practical exercises
        run: python validate_scenarios.py
      - name: Upload model evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-evidence-${{ matrix.python }}
          path: |
            artifacts/*.json
          retention-days: 30
  pytorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-pytorch.txt
      - run: python pytorch_text_baseline.py
      - name: Upload PyTorch NLP evidence
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-text-evidence
          path: |
            artifacts/pytorch-text-results.json
            artifacts/pytorch-text.pt
          retention-days: 30
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t research-search .
      - run: docker run -d --name research-search -p 8001:8001 research-search
      - run: sleep 3 && curl --fail http://127.0.0.1:8001/health
      - if: always()
        run: docker rm -f research-search || true
