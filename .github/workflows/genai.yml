name: Optional GenAI reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-genai.txt
      - run: python -m unittest test_genai -v
      - run: python evaluate_genai.py
      - uses: actions/upload-artifact@v4
        with:
          name: genai-development-diagnostic
          path: artifacts/genai-results.json
