<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Search</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1425;color:#dbeafe;font:16px system-ui;line-height:1.6}main{max-width:1050px;margin:auto;padding:50px 24px}header{border-bottom:1px solid #324461;margin-bottom:28px;padding-bottom:28px}.eyebrow{color:#40d2b8;letter-spacing:3px;font-size:12px}h1{font-size:clamp(32px,6vw,54px);line-height:1.1;margin:16px 0}h2{font-size:20px}section,article{background:#13213a;border:1px solid #324461;border-radius:14px;padding:24px;margin:16px 0}label{display:block;margin:12px 0}input,select{display:block;width:100%;background:#0b1425;color:#dbeafe;border:1px solid #526782;padding:12px;border-radius:8px;font:inherit}button{background:#40d2b8;color:#082f32;border:0;padding:12px 18px;border-radius:8px;font-weight:700;cursor:pointer;margin:8px 8px 8px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fbbf24}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}canvas{display:block;max-width:100%;margin:20px 0}a{color:#40d2b8}footer,small{color:#a5b7d3}#error{color:#fda4af}</style><main><header><div class="eyebrow">ERIK VERA · ENGINEERING PORTFOLIO</div><h1>Research Search</h1><p>Explainable local document retrieval with TF-IDF, cosine similarity, and matched terms.</p></header><section><h2>Interactive demonstration</h2><label>Search the sample knowledge base<input id="query" value="machine learning validation"></label><button id="search">Search documents</button><p id="error" role="alert"></p><div id="result" aria-live="polite"></div></section><footer>Educational prototype · Python standard library · Read README.md and TUTORIAL_ES.md for architecture, limitations, and exercises.</footer></main><script>const result=document.getElementById("result"),error=document.getElementById("error");async function api(payload){error.textContent="";try{const r=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}catch(e){error.textContent=e.message;return null}}function show(data){result.replaceChildren();const pre=document.createElement("pre");pre.textContent=JSON.stringify(data,null,2);result.append(pre)}document.getElementById('search').onclick=async()=>{const d=await api({query:document.getElementById('query').value});if(!d)return;result.replaceChildren();if(!d.results.length)result.textContent='No matching documents. Try SQLite, vision, graph, or validation.';for(const r of d.results){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=r.title;const p=document.createElement('p');p.textContent=r.text;const s=document.createElement('small');s.textContent='Similarity '+r.score+' · Matched: '+r.matched_terms.join(', ');a.append(h,p,s);result.append(a)}};</script></html>
